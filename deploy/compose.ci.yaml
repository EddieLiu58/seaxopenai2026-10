services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: seax
      POSTGRES_USER: seax
      POSTGRES_PASSWORD: seax-ci-only
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-15432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U seax -d seax"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - test-data:/var/lib/postgresql/data
volumes:
  test-data:
