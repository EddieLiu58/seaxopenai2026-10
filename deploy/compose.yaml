services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: seax
      POSTGRES_USER: seax
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the runtime .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U seax -d seax"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:-seax-backend:unconfigured}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/seax
      DATABASE_USERNAME: seax
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEED_GLOBAL_MEMORY: ${SEED_GLOBAL_MEMORY:-true}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      PORT: "8080"
      HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/api/v1/global-memory}
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 130s
    stop_grace_period: 140s
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null "http://127.0.0.1:8080$${HEALTHCHECK_PATH}"']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: [tunnel]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --url, "http://backend:8080"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-seax-poc}-postgres-data
