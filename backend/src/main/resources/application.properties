spring.application.name=seax-backend
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/seax}
spring.datasource.username=${DATABASE_USERNAME:seax}
spring.datasource.password=${DATABASE_PASSWORD:seax}
spring.datasource.hikari.maximum-pool-size=12
spring.flyway.enabled=true
spring.threads.virtual.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
seax.seed.enabled=${SEED_GLOBAL_MEMORY:true}
seax.worker.enabled=${WORKER_ENABLED:true}
seax.openai.api-key=${OPENAI_API_KEY:}
seax.openai.model=${OPENAI_MODEL:gpt-5.5}
seax.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
seax.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://system-boundary.pages.dev}
springdoc.swagger-ui.url=/openapi.json
server.error.include-message=never
server.error.include-stacktrace=never
