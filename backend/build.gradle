plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.seax'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(26) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.3'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { from('examples') { into 'examples' } }
tasks.named('test') { useJUnitPlatform() }

tasks.named('test') { useJUnitPlatform { excludeTags 'integration' } }
tasks.register('integrationTest', Test) {
    description = 'Real PostgreSQL HTTP and worker integration tests (requires compose database).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter test
}

def apiContract = layout.projectDirectory.file('src/main/resources/static/openapi.json')
def apiHtml = layout.projectDirectory.file('swagger/index.html')
tasks.register('generateApiHtml') {
    description = 'Generate a standalone, offline Swagger UI HTML from the OpenAPI contract.'
    group = 'documentation'
    inputs.file(apiContract)
    inputs.files(configurations.runtimeClasspath)
    outputs.file(apiHtml)
    doLast {
        def swaggerJar = configurations.runtimeClasspath.files.find {
            it.name.startsWith('swagger-ui-') && it.name.endsWith('.jar')
        }
        if (swaggerJar == null) throw new GradleException('Swagger UI WebJar is missing')
        def assets = zipTree(swaggerJar)
        def css = assets.matching { include '**/swagger-ui.css' }.singleFile.getText('UTF-8')
        def js = assets.matching { include '**/swagger-ui-bundle.js' }.singleFile.getText('UTF-8')
        // Escape HTML raw-text closing tags without changing JavaScript string values.
        def safeScript = { String value -> value.replaceAll('(?i)</script', '<\\\\/script') }
        def contract = safeScript(apiContract.asFile.getText('UTF-8'))
        def output = apiHtml.asFile
        output.parentFile.mkdirs()
        output.setText("""<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seax API 文件</title><style>${css}</style></head>
<body><div id="swagger-ui"></div>
<script>${safeScript(js)}</script>
<script>SwaggerUIBundle({spec: ${contract}, dom_id: '#swagger-ui',
    deepLinking: true, validatorUrl: null, supportedSubmitMethods: []});</script>
</body></html>
""", 'UTF-8')
    }
}
tasks.named('build') { dependsOn tasks.named('generateApiHtml') }
